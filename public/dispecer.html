<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispečer - ELS 3</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
    body { padding: 15px; background: #f4f6f9; }
    h2 { margin-bottom: 15px; color: #333; }
    
    .layout { display: flex; gap: 20px; flex-wrap: wrap; }
    .card { background: white; padding: 15px; border-radius: 6px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); flex: 1; min-width: 320px; }
    
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; font-weight: bold; font-size: 13px; margin-bottom: 3px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 7px; border: 1px solid #ccc; border-radius: 4px; }
    
    button { background: #0d6efd; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; width: 100%; }
    button:hover { background: #0b5ed7; }
    
    table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
    th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
    th { background: #e9ecef; }
    
    .chat-box { height: 250px; overflow-y: auto; border: 1px solid #ccc; padding: 8px; border-radius: 4px; margin-bottom: 10px; background: #fafafa; }
    .chat-msg { margin-bottom: 5px; font-size: 13px; }
  </style>
</head>
<body>

  <h2>Dispečerski Panel</h2>

  <div class="layout">
    <!-- FORMA ZA SLANJE ZADATKA -->
    <div class="card">
      <h3>Novi Zadatak (Auftrag)</h3>
      <br>
      <form id="tripForm" onsubmit="sendTrip(event)">
        <div class="form-group"><label>Broj naloga (Nr):</label><input type="text" id="nr" required></div>
        <div class="form-group"><label>Datum:</label><input type="text" id="datum" placeholder="23.08.2026"></div>
        <div class="form-group"><label>Vreme (Zeit):</label><input type="text" id="zeit" placeholder="14:30"></div>
        <div class="form-group"><label>Pacijent (Name):</label><input type="text" id="name" required></div>
        <div class="form-group"><label>Kasa (Krankenkasse):</label><input type="text" id="krkasse"></div>
        <div class="form-group"><label>Tip transporta (Art):</label><input type="text" id="art" value="Sitzend"></div>
        <div class="form-group">
          <label>Infekcija (LS):</label>
          <select id="ls">
            <option value="NEIN">NEIN</option>
            <option value="INFEKTION">JA (Infektion)</option>
          </select>
        </div>
        <div class="form-group"><label>Polazak (Abholung - Von):</label><input type="text" id="von" required></div>
        <div class="form-group"><label>Odredište (Ziel - Nach):</label><input type="text" id="nach" required></div>
        <div class="form-group"><label>Razlog (Grund):</label><input type="text" id="grund"></div>
        <div class="form-group"><label>Med. oprema (Med.Ger):</label><input type="text" id="med_ger"></div>
        <div class="form-group"><label>Napomena (Hinweis):</label><textarea id="komm" rows="2"></textarea></div>
        
        <div class="form-group">
          <label>Dodeljeno vozilo (Fahrzeug):</label>
          <select id="fahrzeug" required>
            <option value="">-- Izaberi vozilo --</option>
            <script>
              for(let i=1; i<=10; i++) {
                document.write(`<option value="Fahrzeug ${i}">Fahrzeug ${i}</option>`);
              }
            </script>
          </select>
        </div>

        <button type="submit">Pošalji Zadatak Vozaču</button>
      </form>
    </div>

    <!-- CHAT DISPEČERA -->
    <div class="card">
      <h3>Poruke (Mitteilungen)</h3>
      <br>
      <div class="form-group">
        <label>Izaberi vozilo za Chat:</label>
        <select id="chatFahrzeug" onchange="loadChat()">
          <option value="Fahrzeug 1">Fahrzeug 1</option>
          <script>
            for(let i=2; i<=10; i++) {
              document.write(`<option value="Fahrzeug ${i}">Fahrzeug ${i}</option>`);
            }
          </script>
        </select>
      </div>

      <div class="chat-box" id="chatBox"></div>

      <div class="form-group" style="display: flex; gap: 5px;">
        <input type="text" id="chatInput" placeholder="Napiši poruku vozaču..." onkeypress="if(event.key==='Enter') sendChat()">
        <button type="button" onclick="sendChat()" style="width: 100px;">Pošalji</button>
      </div>
    </div>
  </div>

  <br>

  <!-- TABELA AKTIVNIH NALOGA -->
  <div class="card">
    <h3>Pregled Naloga</h3>
    <table>
      <thead>
        <tr>
          <th>Nr</th>
          <th>Vozilo</th>
          <th>Pacijent</th>
          <th>Polazak</th>
          <th>Odredište</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody id="tripsTable"></tbody>
    </table>
  </div>

  <script>
    async function sendTrip(e) {
      e.preventDefault();
      const payload = {
        nr: document.getElementById('nr').value,
        datum: document.getElementById('datum').value,
        zeit: document.getElementById('zeit').value,
        name: document.getElementById('name').value,
        krkasse: document.getElementById('krkasse').value,
        art: document.getElementById('art').value,
        ls: document.getElementById('ls').value,
        von: document.getElementById('von').value,
        nach: document.getElementById('nach').value,
        grund: document.getElementById('grund').value,
        med_ger: document.getElementById('med_ger').value,
        komm: document.getElementById('komm').value,
        fahrzeug: document.getElementById('fahrzeug').value,
        status: '1. Angenommen'
      };

      try {
        const res = await fetch('/api/trips', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (res.ok) {
          alert('Zadatak uspešno poslat!');
          document.getElementById('tripForm').reset();
          loadTrips();
        } else {
          const errData = await res.json();
          alert('Greška pri slanju zadatka: ' + (errData.error || 'Nepoznata greška'));
        }
      } catch (err) {
        console.error(err);
        alert('Mrežna greška pri slanju zadatka.');
      }
    }

    async function loadTrips() {
      try {
        const res = await fetch('/api/trips');
        const data = await res.json();
        const tbody = document.getElementById('tripsTable');
        tbody.innerHTML = '';

        if(Array.isArray(data)) {
          data.forEach(t => {
            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td>#${t.nr || t.id}</td>
              <td><b>${t.fahrzeug}</b></td>
              <td>${t.name}</td>
              <td>${t.von}</td>
              <td>${t.nach}</td>
              <td><span style="background: #fff3cd; padding: 2px 6px; border-radius: 3px; font-weight: bold;">${t.status}</span></td>
            `;
            tbody.appendChild(tr);
          });
        }
      } catch (err) {
        console.error("Greška pri učitavanju zadataka:", err);
      }
    }

    async function loadChat() {
      const fahrzeug = document.getElementById('chatFahrzeug').value;
      try {
        const res = await fetch(`/api/chat?fahrzeug=${encodeURIComponent(fahrzeug)}`);
        const messages = await res.json();
        const box = document.getElementById('chatBox');
        box.innerHTML = '';

        if(Array.isArray(messages)) {
          messages.forEach(m => {
            const div = document.createElement('div');
            div.className = 'chat-msg';
            div.innerHTML = `<small>[${m.time || ''}]</small> <b>${m.sender}:</b> ${m.text}`;
            box.appendChild(div);
          });
          box.scrollTop = box.scrollHeight;
        }
      } catch (err) {
        console.error("Greška pri učitavanju chata:", err);
      }
    }

    async function sendChat() {
      const fahrzeug = document.getElementById('chatFahrzeug').value;
      const input = document.getElementById('chatInput');
      if (!input.value.trim()) return;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            fahrzeug: fahrzeug,
            sender: 'Disponent',
            text: input.value.trim()
          })
        });

        if (res.ok) {
          input.value = '';
          loadChat();
        } else {
          alert("Greška pri slanju poruke.");
        }
      } catch (err) {
        console.error("Greška pri slanju poruke:", err);
      }
    }

    setInterval(loadTrips, 3000);
    setInterval(loadChat, 2000);
    loadTrips();
    loadChat();
  </script>
</body>
</html>
